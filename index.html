<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROYA — إدارة متجر رويا</title>
<meta name="theme-color" content="#8A193B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--m:#8A193B;--md:#5E0F28;--ml:#F6E9EE;--g:#C9A45C;--gl:#E2BE78;--bg:#FBF7F4;--ink:#2A1A20;--mut:#7A6A70;--ok:#2E7D5B;--bad:#C0392B;--line:#EADDE2;--r:18px;--nav:68px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;direction:rtl;overscroll-behavior-y:contain}
body{font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto;position:relative;background:var(--bg)}
#view{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.pad{padding:14px 16px}
/* top bar */
.top{background:linear-gradient(135deg,var(--md),var(--m));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--g)}
.top h1{margin:0;font-size:19px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tl{width:34px;height:38px;background:var(--gl);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;flex:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;display:grid;place-items:center;cursor:pointer;flex:none}
/* nav */
#nav{position:absolute;bottom:0;inset-inline:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;box-shadow:0 -6px 24px rgba(94,15,40,.07)}
#nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut);font-size:11.5px;font-weight:600;cursor:pointer;position:relative}
#nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--m)}
#nav button.on::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--m)}
#nav .cash{color:#fff}
#nav .cash i{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--m),var(--md));display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 16px rgba(138,25,59,.4);border:4px solid var(--bg)}
#nav .cash span{color:var(--m);margin-top:-2px}
/* cards & text */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(94,15,40,.04)}
.card h3{margin:0 0 10px;font-size:16px;font-weight:800;color:var(--m)}
.sec{font-weight:800;color:var(--m);margin:18px 2px 8px;font-size:15.5px;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:8px;height:8px;background:var(--g);transform:rotate(45deg)}
.muted{color:var(--mut);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.b{font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 12px;position:relative;overflow:hidden}
.kpi small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.kpi b{font-size:19px;font-weight:800;color:var(--m);display:block;margin-top:2px;white-space:nowrap}
.kpi.hot{background:linear-gradient(135deg,var(--m),var(--md));border:0}.kpi.hot small{color:#F3DCE3}.kpi.hot b{color:#fff}
.kpi.gold b{color:#9A7A2E}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.gap{gap:8px}.grow{flex:1;min-width:0}
/* buttons */
.btn{border:1.5px solid var(--m);background:#fff;color:var(--m);padding:11px 16px;border-radius:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--m),var(--md));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(138,25,59,.28)}
.btn.gold{background:var(--g);border-color:var(--g);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.big{width:100%;padding:14px;font-size:16px}.btn.block{width:100%}
.btn[disabled]{opacity:.5}
/* inputs */
label.f{display:block;margin-bottom:11px;font-size:13px;font-weight:700;color:var(--mut)}
label.f>span.hint{font-weight:500;color:#A8989E}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:11px 13px;font-size:15.5px;outline:none;margin-top:4px;transition:.15s;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--m);box-shadow:0 0 0 3px rgba(138,25,59,.1)}
input[type=number]{direction:ltr;text-align:right}
.search{display:flex;gap:8px;margin-bottom:12px}.search input{margin:0}
/* chips */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer}
.chip.on{background:var(--m);border-color:var(--m);color:#fff}
.tag{display:inline-block;background:var(--ml);color:var(--m);border-radius:9px;padding:2px 9px;font-size:12px;font-weight:700}
.tag.low{background:#FFF1E0;color:#B5651D}.tag.out{background:#FBE3E0;color:var(--bad)}.tag.good{background:#E3F4EC;color:var(--ok)}
/* list items */
.li{display:flex;gap:12px;align-items:center;padding:12px;background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:9px;cursor:pointer}
.li:active{background:var(--ml)}
.av{width:44px;height:44px;border-radius:14px;background:var(--ml);color:var(--m);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.li .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--mut)}
.price{font-weight:800;color:var(--m);white-space:nowrap}.price s{color:#A8989E;font-weight:500;font-size:12px;display:block}
.fab{position:fixed;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));inset-inline-start:max(18px,calc(50vw - 342px));width:56px;height:56px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:30px;box-shadow:0 8px 22px rgba(0,0,0,.25);z-index:25;cursor:pointer;line-height:1}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.empty .em{font-size:44px;opacity:.5}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.sheet-wrap.on{pointer-events:auto}
.sheet-bg{position:absolute;inset:0;background:rgba(42,10,22,.5);opacity:0;transition:.25s}
.sheet-wrap.on .sheet-bg{opacity:1}
.sheet{position:relative;background:var(--bg);width:100%;max-width:720px;max-height:92dvh;overflow-y:auto;border-radius:26px 26px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:.3s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.on .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:#D9C8CE;margin:4px auto 12px}
.sheet h2{margin:0 0 14px;font-size:18px;color:var(--m);font-weight:800}
.sheet.top2{z-index:5}
#toast{position:fixed;bottom:calc(var(--nav) + 90px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);background:#2A1A20;color:#fff;padding:11px 20px;border-radius:14px;z-index:300;opacity:0;transition:.3s;pointer-events:none;max-width:88vw;text-align:center;font-weight:600;font-size:14px}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{background:var(--m);color:#fff;padding:7px 6px;font-weight:700;font-size:12.5px}
table.t th:first-child{border-radius:0 10px 10px 0}table.t th:last-child{border-radius:10px 0 0 10px}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
table.t td:first-child{text-align:right}
.scroll-x{overflow-x:auto}
/* sizes editor */
.srow{display:grid;grid-template-columns:1.2fr 1fr 40px;gap:8px;align-items:center;margin-bottom:6px}.srow input{margin:0}
.srow button{border:0;background:#FBE3E0;color:var(--bad);border-radius:10px;height:40px;font-size:16px;cursor:pointer}
.prev{background:linear-gradient(135deg,#FBF1F4,#fff);border:1.5px dashed #E3BFCB;border-radius:16px;padding:12px;margin:6px 0 14px}
.prev .grid3 b{display:block;font-size:17px;color:var(--m)}.prev small{color:var(--mut);font-size:12px}
.qrbox{text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.qrbox canvas{width:170px;height:170px;image-rendering:pixelated}
/* cart */
.cl{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cl:last-child{border:0}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.qty button{border:0;background:var(--ml);width:34px;height:32px;font-size:18px;color:var(--m);font-weight:800;cursor:pointer}
.qty b{min-width:30px;text-align:center}
.sugg{margin-top:8px}.sugg .li{margin-bottom:6px;padding:9px 11px}
.totrow{display:flex;justify-content:space-between;padding:5px 0}
.totrow.big{font-size:19px;font-weight:800;color:var(--m);border-top:2px solid var(--line);margin-top:6px;padding-top:10px}
/* scanner */
#scan{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column}
#scan.on{display:flex}
#scan video{flex:1;width:100%;object-fit:cover;min-height:0}
.scan-frame{position:absolute;left:50%;top:34%;width:62vw;max-width:300px;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:24px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);border:3px solid var(--gl)}
.scan-frame::after{content:"";position:absolute;inset-inline:8%;top:0;height:3px;background:var(--gl);animation:sweep 1.8s ease-in-out infinite;box-shadow:0 0 14px var(--gl)}
@keyframes sweep{0%,100%{top:6%}50%{top:94%}}
.scan-panel{background:var(--bg);border-radius:24px 24px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:46dvh;overflow:auto}
.scan-top{position:absolute;top:calc(12px + env(safe-area-inset-top));inset-inline:12px;display:flex;justify-content:space-between;color:#fff;font-weight:700;z-index:2}
.scan-top span{background:rgba(0,0,0,.5);padding:7px 14px;border-radius:12px}
.flash{animation:fl .5s}@keyframes fl{0%{background:#fff}100%{background:transparent}}
/* banner */
.due{background:linear-gradient(135deg,#FFF6E5,#FFF);border:1.5px solid #E8C984;border-radius:16px;padding:12px 14px;margin-bottom:12px}
.due b{color:#8A6212}
.seg{display:flex;background:var(--ml);border-radius:14px;padding:4px;gap:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:11px;font-weight:700;color:var(--m);white-space:nowrap;cursor:pointer;font-size:13.5px}
.seg button.on{background:var(--m);color:#fff}
.debtcard{background:linear-gradient(135deg,var(--m),var(--md));color:#fff;border-radius:20px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.debtcard::after{content:"";position:absolute;width:180px;height:180px;border:18px solid rgba(255,255,255,.07);transform:rotate(45deg);left:-60px;bottom:-90px}
.debtcard .big{font-size:30px;font-weight:800}
/* splash */
#splash{position:fixed;inset:0;z-index:1000;background:radial-gradient(circle at 50% 40%,#8A193B 0%,#5E0F28 55%,#3A0817 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s,visibility .7s;overflow:hidden}
#splash.out{opacity:0;visibility:hidden}
.sp-ring{position:absolute;left:50%;top:44%;border:2px solid rgba(226,190,120,.55);transform:translate(-50%,-50%) rotate(45deg) scale(.2);opacity:0;animation:ring 2.2s .15s cubic-bezier(.2,.8,.2,1) forwards}
.sp-ring.r1{width:250px;height:250px}.sp-ring.r2{width:330px;height:330px;border-color:rgba(226,190,120,.28);animation-delay:.4s}.sp-ring.r3{width:420px;height:420px;border-color:rgba(226,190,120,.14);animation-delay:.65s}
@keyframes ring{0%{opacity:0;transform:translate(-50%,-50%) rotate(-45deg) scale(.2)}60%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) rotate(45deg) scale(1)}}
.sp-logo{position:relative;width:min(56vw,240px);aspect-ratio:513/581;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;background:linear-gradient(110deg,#C9A45C 20%,#fff6dc 38%,#fff 46%,#E2BE78 56%,#C9A45C 80%);background-size:260% 100%;background-position:130% 0;opacity:0;transform:scale(.55) rotate(-14deg);filter:blur(10px);animation:logoIn 1.5s .35s cubic-bezier(.2,.9,.25,1.05) forwards,shine 1.7s 1.5s ease-in-out forwards;margin-top:-30px}
@keyframes logoIn{0%{opacity:0;transform:scale(.55) rotate(-14deg);filter:blur(10px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes shine{0%{background-position:130% 0}100%{background-position:-30% 0}}
.sp-word{margin-top:14px;color:#E2BE78;font-weight:800;font-size:15px;letter-spacing:16px;padding-inline-start:16px;opacity:0;animation:fadeUp .9s 1.5s ease forwards}
.sp-sub{margin-top:18px;font-weight:700;letter-spacing:1px;color:#F3DCE3;font-size:14px;opacity:0;animation:fadeUp .9s 1.85s ease forwards}
.sp-skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));color:rgba(255,255,255,.4);font-size:12px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sp-logo,.sp-ring,.sp-word,.sp-sub{animation-duration:.01s!important;animation-delay:0s!important}}
@media print{#nav,.top{display:none}}

.grid2>*,.grid3>*{min-width:0}
input[type=date],input[type=month]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;direction:ltr;text-align:right;min-height:46px}
</style>
</head>
<body>
<div id="splash">
  <div class="sp-ring r3"></div><div class="sp-ring r2"></div><div class="sp-ring r1"></div>
  <div class="sp-logo"></div>
  <div class="sp-sub">مهندس مدني إبراهيم الجمل</div>
  <div class="sp-skip">اQuintlab - generated by Eng.Ibrahim Elgamal</div>
</div>
<div id="app"><div id="view"></div><nav id="nav"></nav></div>
<div id="scan">
  <div class="scan-top"><span>تم مسح: <b id="scan-n">0</b></span><span></span></div>
  <video playsinline muted></video><div class="scan-frame"></div>
  <div class="scan-panel"><div id="scan-list"></div><button class="btn primary big" data-a="stopscan" style="margin-top:10px">✅ تم — رجوع للفاتورة</button></div>
</div>

<script>'use strict';
/* ===================== ROYA — إدارة متجر رويا للملابس ===================== */
const LS_KEY='roya_db_v1', CUR='ج.م';
const blankDB=()=>({settings:{store:'متجر رويا للملابس',notify:false,lastNotify:''},items:[],customers:[],invoices:[],payments:[],ledger:[],seq:{item:0,cust:0,inv:0}});
let MEM=null;
function loadDB(){ try{const r=localStorage.getItem(LS_KEY); if(r){const d=JSON.parse(r); return Object.assign(blankDB(),d,{settings:Object.assign(blankDB().settings,d.settings||{}),seq:Object.assign(blankDB().seq,d.seq||{})});}}catch(e){} return MEM||blankDB(); }
let db=loadDB();
function save(){ MEM=db; try{localStorage.setItem(LS_KEY,JSON.stringify(db));}catch(e){ toast('تنبيه: تعذّر الحفظ الدائم على المتصفح'); } }

/* ---------- أدوات ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{v=parseFloat(String(v??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/,/g,'.'));return isNaN(v)?0:v;};
const money=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const cur=n=>money(n)+' '+CUR;
const pad=(n,l=2)=>String(n).padStart(l,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const hhmm=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const dAr=s=>{if(!s)return '—';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const initial=n=>(String(n||'?').trim()[0]||'?');
window.STORE_NAME=()=>db.settings.store||'متجر رويا للملابس';
window.STAMP=()=>dAr(today())+'  '+hhmm();
const cust=id=>db.customers.find(c=>c.id===id);
const item=id=>db.items.find(i=>i.id===id);
const finalPrice=it=>{const s=num(it.sell);if(it.dType==='pct')return Math.max(0,s*(1-num(it.dVal)/100));if(it.dType==='amt')return Math.max(0,s-num(it.dVal));return s;};
const profitOf=it=>finalPrice(it)-num(it.buy);
const stockOf=it=>(it.sizes||[]).reduce((a,s)=>a+num(s.q),0);
const weekStart=s=>{const d=new Date(s+'T00:00:00');return addDays(s,-((d.getDay()+1)%7));};   // الأسبوع يبدأ السبت

/* ---------- واجهة: توست / شيت / تأكيد ---------- */
let toastT; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600);}
function sheet(html){ closeSheet(); const s=document.createElement('div'); s.className='sheet-wrap'; s.id='sheet';
  s.innerHTML=`<div class="sheet-bg" data-a="closesheet"></div><div class="sheet"><div class="grab"></div>${html}</div>`;
  document.body.appendChild(s); requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('on'))); return s; }
function closeSheet(){ const s=$('#sheet'); if(s){ s.classList.remove('on'); setTimeout(()=>s.remove(),300); s.id=''; } }
function ask(msg,ok='تأكيد',danger=false){ return new Promise(res=>{
  const s=document.createElement('div'); s.className='sheet-wrap on'; s.style.zIndex=400;
  s.innerHTML=`<div class="sheet-bg" style="opacity:1"></div><div class="sheet" style="transform:none;border-radius:22px;margin:16px;max-width:420px;align-self:center"><h2 style="font-size:16px">${esc(msg)}</h2><div class="grid2"><button class="btn ${danger?'danger':'primary'}" id="ay">${esc(ok)}</button><button class="btn" id="an">إلغاء</button></div></div>`;
  document.body.appendChild(s); const done=v=>{s.remove();res(v);}; $('#ay',s).onclick=()=>done(true); $('#an',s).onclick=()=>done(false); $('.sheet-bg',s).onclick=()=>done(false); }); }

/* ---------- حالة الواجهة ---------- */
const ui={tab:'home',page:null,q:{inv:'',cust:''},rep:{type:'day',date:today(),month:today().slice(0,7),year:String(new Date().getFullYear()),from:today(),to:today()}};
const cart={cust:null,lines:[],extra:'',paid:'',due:'',note:''};

const ICON={
 home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>',
 inv:'<svg viewBox="0 0 24 24"><path d="M12 3a2.5 2.5 0 012.5 2.5c0 1.2-1 2-2 2.6V9"/><path d="M12 9l9 6.2a1.4 1.4 0 01-.8 2.5H3.8a1.4 1.4 0 01-.8-2.5L12 9z"/></svg>',
 cash:'<svg viewBox="0 0 24 24" style="stroke:#fff;width:26px;height:26px"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/><path d="M3 12h18"/></svg>',
 cust:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.8c2 .7 3.2 2.3 3.5 5.2"/></svg>',
 rep:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'};
function buildNav(){ const t=[['home','الرئيسية'],['inv','المخزون'],['cash','الكاشير'],['cust','العملاء'],['rep','التقارير']];
  $('#nav').innerHTML=t.map(([k,l])=>k==='cash'?`<button class="cash" data-a="tab" data-v="cash"><i>${ICON.cash}</i><span>${l}</span></button>`:`<button data-a="tab" data-v="${k}">${ICON[k]}<span>${l}</span></button>`).join(''); }
function markNav(){ $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===ui.tab&&!ui.page)); }
const hdr=(title,o={})=>`<div class="top">${o.back?`<button class="iconbtn" data-a="back">→</button>`:'<span class="tl"></span>'}<h1>${esc(title)}</h1>${o.act||''}</div>`;

/* ===================== المنطق: العملاء والمديونية ===================== */
function addLedger(c,delta,type,ref,note){
  c.debt=Math.round((num(c.debt)+delta)*100)/100; if(Math.abs(c.debt)<0.005)c.debt=0;
  const e={id:uid(),date:today(),time:hhmm(),custId:c.id,type,amount:delta,balance:c.debt,ref:ref||'',note:note||''}; db.ledger.push(e); return e; }
const custInvoices=id=>db.invoices.filter(i=>i.custId===id);
const custPayments=id=>db.payments.filter(p=>p.custId===id);
function dueLists(d=today()){ const all=db.customers.filter(c=>num(c.debt)>0.005&&c.dueDate);
  return {today:all.filter(c=>c.dueDate===d),late:all.filter(c=>c.dueDate<d)}; }

/* ===================== التقارير: الحساب ===================== */
function compute(from,to){
  const inR=d=>d>=from&&d<=to;
  const inv=db.invoices.filter(i=>inR(i.date)), pay=db.payments.filter(p=>inR(p.date));
  const R={from,to,inv,pay,sales:0,cashSales:0,debtAdded:0,collected:0,profit:0,pieces:0};
  const items={}, days={};
  const day=d=>days[d]||(days[d]={d,n:0,sales:0,rev:0,profit:0});
  inv.forEach(i=>{ R.sales+=i.total; R.cashSales+=i.paid; R.debtAdded+=i.debt; R.profit+=i.profit;
    const dd=day(i.date); dd.n++; dd.sales+=i.total; dd.rev+=i.paid; dd.profit+=i.profit;
    i.lines.forEach(l=>{ R.pieces+=l.qty; const k=l.code; const a=items[k]||(items[k]={code:l.code,name:l.name,qty:0,total:0}); a.qty+=l.qty; a.total+=l.qty*l.price; }); });
  pay.forEach(p=>{ R.collected+=p.amount; day(p.date).rev+=p.amount; });
  R.revenue=R.cashSales+R.collected; R.items=Object.values(items).sort((a,b)=>b.total-a.total); R.days=Object.values(days).sort((a,b)=>a.d<b.d?-1:1);
  R.newDebts=inv.filter(i=>i.debt>0.005); return R; }
function repRange(){ const r=ui.rep;
  if(r.type==='day') return {from:r.date,to:r.date,title:'التقرير اليومي',sub:'يوم '+dAr(r.date)};
  if(r.type==='week'){const f=weekStart(r.date);return {from:f,to:addDays(f,6),title:'التقرير الأسبوعي',sub:`من ${dAr(f)} إلى ${dAr(addDays(f,6))}`};}
  if(r.type==='month'){const [y,m]=r.month.split('-').map(Number);const f=`${y}-${pad(m)}-01`,t=ymd(new Date(y,m,0));return {from:f,to:t,title:'التقرير الشهري',sub:`شهر ${pad(m)}/${y}`};}
  if(r.type==='year'){const y=r.year;return {from:y+'-01-01',to:y+'-12-31',title:'التقرير السنوي',sub:'سنة '+y};}
  return {from:r.from,to:r.to,title:'تقرير فترة محددة',sub:`من ${dAr(r.from)} إلى ${dAr(r.to)}`}; }

/* ===================== الشاشات الرئيسية ===================== */
const TABS={};
TABS.home=()=>{ const d=today(), r=compute(d,d), due=dueLists(d);
  const dueN=due.today.length+due.late.length;
  return hdr(window.STORE_NAME(),{act:`<button class="iconbtn" data-a="settings">⚙</button>`})+`<div class="pad">
  ${dueN?`<div class="due"><div class="row sp"><div><b>🔔 تذكير بالسداد</b><div class="muted">${due.today.length?`${due.today.length} عميل ميعاد سداده النهاردة`:''}${due.today.length&&due.late.length?' • ':''}${due.late.length?`${due.late.length} متأخر`:''}</div></div><button class="btn sm gold" data-a="duepdf">PDF</button></div></div>`:''}
  <div class="kpi hot" style="margin-bottom:10px"><small>إجمالي الإيرادات المحصّلة النهاردة</small><b style="font-size:28px">${cur(r.revenue)}</b></div>
  <div class="grid2" style="margin-bottom:10px">
   <div class="kpi"><small>مبيعات اليوم</small><b>${cur(r.sales)}</b></div>
   <div class="kpi gold"><small>ربح المبيعات</small><b>${cur(r.profit)}</b></div>
   <div class="kpi"><small>عدد الفواتير</small><b>${r.inv.length}</b></div>
   <div class="kpi"><small>تحصيل مديونيات</small><b>${cur(r.collected)}</b></div></div>
  <div class="sec">اختصارات</div>
  <div class="grid2">
   <button class="btn primary" data-a="tab" data-v="cash">🧾 فاتورة جديدة</button>
   <button class="btn" data-a="newitem">➕ قطعة جديدة</button>
   <button class="btn" data-a="newcust">👤 عميل جديد</button>
   <button class="btn" data-a="todaypdf">📄 تقرير اليوم PDF</button></div>
  <div class="sec">ملخص المتجر</div>
  <div class="grid2">
   <div class="kpi"><small>أنواع القطع</small><b>${db.items.length}</b></div>
   <div class="kpi"><small>إجمالي القطع بالمخزون</small><b>${db.items.reduce((a,i)=>a+stockOf(i),0)}</b></div>
   <div class="kpi"><small>عدد العملاء</small><b>${db.customers.length}</b></div>
   <div class="kpi"><small>إجمالي مديونيات العملاء</small><b class="bad">${cur(db.customers.reduce((a,c)=>a+num(c.debt),0))}</b></div></div>
  </div>`; };

function invList(){ const q=ui.q.inv.trim().toLowerCase();
  const L=db.items.filter(it=>!q||(it.name+' '+it.code+' '+(it.source||'')).toLowerCase().includes(q));
  if(!L.length) return `<div class="empty"><div class="em">👗</div>${db.items.length?'مفيش نتائج':'لسه مفيش قطع — دوس + لإضافة أول قطعة'}</div>`;
  return L.map(it=>{ const st=stockOf(it), fp=finalPrice(it);
    return `<div class="li" data-a="edititem" data-id="${it.id}"><div class="av">${esc(initial(it.name))}</div>
    <div class="grow"><div class="t">${esc(it.name)}</div><div class="s">${esc(it.code)}${it.source?' • '+esc(it.source):''}</div>
    <div class="chips" style="margin-top:5px;gap:4px">${(it.sizes||[]).filter(s=>s.size).map(s=>`<span class="tag ${num(s.q)<=0?'out':num(s.q)<=2?'low':''}">${esc(s.size)}: ${num(s.q)}</span>`).join('')}</div></div>
    <div class="price">${money(fp)}${it.dType&&it.dType!=='none'&&num(it.dVal)>0?`<s>${money(it.sell)}</s>`:''}<span class="tag ${st<=0?'out':'good'}" style="margin-top:4px">${st} قطعة</span></div></div>`; }).join(''); }
TABS.inv=()=>hdr('المخزون',{act:`<button class="iconbtn" data-a="exportinv" title="شيت إكسيل">📊</button>`})+`<div class="pad">
  <div class="search"><input id="qinv" data-i="qinv" placeholder="🔍 ابحث بالاسم أو الكود أو المصدر" value="${esc(ui.q.inv)}"></div>
  <div id="list">${invList()}</div></div><button class="fab" data-a="newitem">+</button>`;

function custList(){ const q=ui.q.cust.trim().toLowerCase();
  const L=db.customers.filter(c=>!q||(c.name+' '+c.code+' '+(c.phone||'')).toLowerCase().includes(q));
  if(!L.length) return `<div class="empty"><div class="em">👥</div>${db.customers.length?'مفيش نتائج':'لسه مفيش عملاء'}</div>`;
  return L.map(c=>`<div class="li" data-a="opencust" data-id="${c.id}"><div class="av">${esc(initial(c.name))}</div>
   <div class="grow"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.code)} • ${esc(c.phone||'بدون رقم')}</div></div>
   <div class="price ${num(c.debt)>0?'bad':'ok'}">${num(c.debt)>0?money(c.debt)+' '+CUR:'مسدد ✓'}${num(c.debt)>0&&c.dueDate?`<span class="muted" style="display:block;font-weight:500">سداد ${dAr(c.dueDate)}</span>`:''}</div></div>`).join(''); }
TABS.cust=()=>hdr('العملاء',{act:`<button class="iconbtn" data-a="exportcust" title="شيت إكسيل">📊</button>`})+`<div class="pad">
  <div class="search"><input id="qcust" data-i="qcust" placeholder="🔍 اسم / كود / موبايل" value="${esc(ui.q.cust)}"></div>
  <div id="list">${custList()}</div></div><button class="fab" data-a="newcust">+</button>`;

/* ---------- الكاشير ---------- */
const cartSub=()=>cart.lines.reduce((a,l)=>a+l.qty*l.price,0);
const cartTotal=()=>Math.max(0,cartSub()-num(cart.extra));
const cartPaid=()=>cart.paid===''?cartTotal():num(cart.paid);
function custBox(){ const c=cart.cust&&cust(cart.cust);
  if(c) return `<div class="row"><div class="av">${esc(initial(c.name))}</div><div class="grow"><div class="b">${esc(c.name)} <span class="tag">${esc(c.code)}</span></div><div class="s muted">📞 ${esc(c.phone||'—')} • 📍 ${esc(c.address||'—')}</div><div class="s">مديونيته الحالية: <b class="${num(c.debt)>0?'bad':'ok'}">${cur(c.debt)}</b></div></div><button class="btn sm" data-a="clearcust">تغيير</button></div>`;
  return `<label class="f">العميل <span class="hint">(اكتب الاسم أو الكود أو الموبايل — أو سيبه فاضي لبيع كاش)</span><input id="custq" data-i="custq" placeholder="ابحث عن عميل…" autocomplete="off"></label><div class="sugg" id="custsugg"></div><button class="btn sm block" data-a="newcust" data-cart="1">➕ عميل جديد</button>`; }
function cartHtml(){ if(!cart.lines.length) return `<div class="empty" style="padding:18px"><div class="em">🛍️</div>امسح QR القطعة أو اكتب كودها</div>`;
  return cart.lines.map((l,i)=>`<div class="cl"><div><div class="b">${esc(l.name)}</div><div class="s muted">${esc(l.code)}${l.size?' • مقاس '+esc(l.size):''} • سعر القطعة ${money(l.price)}</div></div>
   <div class="row"><div class="qty"><button data-a="qtyu" data-i="${i}">+</button><b>${l.qty}</b><button data-a="qtyd" data-i="${i}">−</button></div><button class="iconbtn" style="background:#FBE3E0;color:var(--bad);width:34px;height:34px" data-a="rmline" data-i="${i}">✕</button></div>
   <div class="b price" style="grid-column:1/-1;text-align:left">${cur(l.qty*l.price)}</div></div>`).join(''); }
function totHtml(){ const t=cartTotal(), paid=cartPaid(), rem=Math.max(0,t-paid);
  return `<div class="totrow"><span>إجمالي القطع</span><b>${cart.lines.reduce((a,l)=>a+l.qty,0)}</b></div>
  <div class="totrow"><span>المجموع</span><b>${cur(cartSub())}</b></div>
  <label class="f">خصم إضافي على الفاتورة<input id="cx" data-i="cx" type="number" inputmode="decimal" min="0" value="${esc(cart.extra)}" placeholder="0"></label>
  <div class="totrow big"><span>الإجمالي</span><span>${cur(t)}</span></div>
  <label class="f" style="margin-top:12px">المدفوع الآن <span class="hint">(فاضي = دفع كامل)</span><input id="cp" data-i="cp" type="number" inputmode="decimal" min="0" value="${esc(cart.paid)}" placeholder="${money(t)}"></label>
  <div class="chips" style="margin-bottom:10px"><button class="chip" data-a="fullpaid">كاش كامل</button><button class="chip" data-a="fulldebt">آجل بالكامل</button></div>
  <div class="totrow"><span>المتبقي (يتسجل مديونية)</span><b id="rem" class="${rem>0?'bad':'ok'}">${cur(rem)}</b></div>
  <div id="duebox" style="display:${rem>0.005?'block':'none'}"><label class="f">يوم سداد المديونية المتفق عليه<input id="cd" data-i="cd" type="date" value="${esc(cart.due||addDays(today(),30))}"></label></div>
  <label class="f">ملاحظات<input id="cn" data-i="cn" value="${esc(cart.note)}" placeholder="اختياري"></label>`; }
TABS.cash=()=>hdr('الكاشير',{act:`<button class="iconbtn" data-a="resetcart" title="فاتورة جديدة">🗑</button>`})+`<div class="pad">
  <div class="card" id="custbox">${custBox()}</div>
  <div class="card"><button class="btn primary big" data-a="scan">📷 افتح الكاميرا وامسح QR</button>
   <div class="row" style="margin-top:10px"><input id="codeIn" data-i="codein" placeholder="أو اكتب كود / اسم القطعة" style="margin:0" enterkeyhint="done"><button class="btn" data-a="addcode">إضافة</button></div><div class="sugg" id="isugg"></div></div>
  <div class="card" id="cartbox">${cartHtml()}</div>
  <div class="card" id="totbox">${totHtml()}</div>
  <button class="btn primary big" data-a="saveinv">✅ حفظ الفاتورة</button></div>`;
function refreshCart(){ const a=$('#cartbox'); if(a)a.innerHTML=cartHtml(); const b=$('#totbox'); if(b)b.innerHTML=totHtml(); }
function refreshRem(){ const t=cartTotal(), rem=Math.max(0,t-cartPaid()); const e=$('#rem'); if(e){e.textContent=cur(rem);e.className=rem>0?'bad':'ok';}
  const d=$('#duebox'); if(d)d.style.display=rem>0.005?'block':'none'; const big=$('.totrow.big span:last-child'); if(big)big.textContent=cur(t); const cp=$('#cp'); if(cp)cp.placeholder=money(t); }

/* ---------- التقارير ---------- */
function repPreview(){ const R=repRange(), r=compute(R.from,R.to);
  return `<div class="grid2"><div class="kpi hot" style="grid-column:1/-1"><small>إجمالي الإيرادات المحصّلة</small><b style="font-size:26px">${cur(r.revenue)}</b></div>
  <div class="kpi"><small>إجمالي المبيعات</small><b>${cur(r.sales)}</b></div><div class="kpi gold"><small>ربح المبيعات</small><b>${cur(r.profit)}</b></div>
  <div class="kpi"><small>بيع كاش (مدفوع)</small><b>${cur(r.cashSales)}</b></div><div class="kpi"><small>تحصيل مديونيات</small><b>${cur(r.collected)}</b></div>
  <div class="kpi"><small>ديون جديدة (آجل)</small><b class="bad">${cur(r.debtAdded)}</b></div><div class="kpi"><small>فواتير / قطع</small><b>${r.inv.length} / ${r.pieces}</b></div></div>`; }
TABS.rep=()=>{ const r=ui.rep; const T=[['day','يومي'],['week','أسبوعي'],['month','شهري'],['year','سنوي'],['range','فترة']];
  const f={day:`<label class="f">اليوم<input type="date" data-i="rdate" value="${r.date}"></label>`,
   week:`<label class="f">أي يوم داخل الأسبوع (الأسبوع من السبت للجمعة)<input type="date" data-i="rdate" value="${r.date}"></label>`,
   month:`<label class="f">الشهر<input type="month" data-i="rmonth" value="${r.month}"></label>`,
   year:`<label class="f">السنة<input type="number" data-i="ryear" value="${r.year}" min="2000" max="2100"></label>`,
   range:`<div class="grid2"><label class="f">من<input type="date" data-i="rfrom" value="${r.from}"></label><label class="f">إلى<input type="date" data-i="rto" value="${r.to}"></label></div>`}[r.type];
  return hdr('التقارير')+`<div class="pad"><div class="seg">${T.map(([k,l])=>`<button class="${r.type===k?'on':''}" data-a="reptype" data-v="${k}">${l}</button>`).join('')}</div>

  const bought=inv.reduce((a,i)=>a+i.total,0), paidInv=inv.reduce((a,i)=>a+i.paid,0), paidPay=pay.reduce((a,x)=>a+x.amount,0);

  if(sub==='items'){ const m={}; inv.forEach(i=>i.lines.forEach(l=>{ (m[l.code]||(m[l.code]={name:l.name,code:l.code,q:0,tot:0,last:i.date})).q+=l.qty; m[l.code].tot+=l.qty*l.price; }));
    const L=Object.values(m); body=L.length?`<div class="card scroll-x"><table class="t"><tr><th>القطعة</th><th>الكمية</th><th>الإجمالي</th><th>آخر شراء</th></tr>${L.map(x=>`<tr><td>${esc(x.name)}<div class="muted">${esc(x.code)}</div></td><td>${x.q}</td><td>${money(x.tot)}</td><td>${dAr(x.last)}</td></tr>`).join('')}</table></div>`:'<div class="empty">مفيش مشتريات</div>'; }
  if(sub==='led') body=led.length?`<div class="card scroll-x"><table class="t"><tr><th>التاريخ</th><th>النوع</th><th>المبلغ</th><th>الرصيد</th></tr>${led.map(e=>`<tr><td>${dAr(e.date)}<div class="muted">${e.time}</div></td><td>${{debt:'دين فاتورة',payment:'تسديد',adjust:'تعديل يدوي'}[e.type]||e.type}<div class="muted">${esc(e.ref||e.note||'')}</div></td><td class="${e.amount>0?'bad':'ok'}">${e.amount>0?'+':''}${money(e.amount)}</td><td>${money(e.balance)}</td></tr>`).join('')}</table></div>`:'<div class="empty">مفيش حركات</div>';
  return hdr(c.name,{back:1,act:`<button class="iconbtn" data-a="editcust" data-id="${c.id}">✎</button>`})+`<div class="pad">
   <div class="debtcard"><div class="muted" style="color:#F3DCE3">المديونية الحالية</div><div class="big">${cur(c.debt)}</div>
    <div style="color:#F3DCE3;font-size:13px">${esc(c.code)} • 📞 ${esc(c.phone||'—')}${c.address?' • 📍 '+esc(c.address):''}</div>
    ${num(c.debt)>0&&c.dueDate?`<div style="margin-top:6px;color:var(--gl);font-weight:700">📅 موعد السداد: ${dAr(c.dueDate)}</div>`:''}
    <div class="row gap wrap" style="margin-top:12px"><button class="btn sm gold" data-a="pay" data-id="${c.id}" ${num(c.debt)>0?'':'disabled'}>💵 تسديد</button><button class="btn sm" style="background:rgba(255,255,255,.15);color:#fff;border-color:transparent" data-a="custcash" data-id="${c.id}">🧾 فاتورة له</button><button class="btn sm" style="background:rgba(255,255,255,.15);color:#fff;border-color:transparent" data-a="custpdf" data-id="${c.id}">📄 كشف PDF</button>${c.phone?`<a class="btn sm" style="background:rgba(255,255,255,.15);color:#fff;border-color:transparent;text-decoration:none" href="tel:${esc(c.phone)}">📞 اتصال</a>`:''}</div></div>

const SIZE_CHIPS=['S','M','L','XL','XXL','Free','36','38','40','42','44','46'];
const sizeRow=(s='',q='')=>`<div class="srow"><input class="s-size" placeholder="المقاس" value="${esc(s)}"><input class="s-qty" type="number" inputmode="numeric" min="0" placeholder="العدد" value="${esc(q)}"><button data-a="rmsize" type="button">✕</button></div>`;
function itemSheet(id){ const it=id?item(id):null, s=it||{name:'',code:'',source:'',buy:'',sell:'',dType:'none',dVal:'',sizes:[]};
  const h=sheet(`<h2>${it?'تعديل قطعة':'قطعة جديدة'}</h2>
  <label class="f">اسم القطعة *<input id="f-name" value="${esc(s.name)}" placeholder="مثال: فستان سواريه"></label>
  <div class="grid2"><label class="f">كود القطعة<input id="f-code" value="${esc(s.code)}" placeholder="تلقائي"></label><label class="f">مصدر القطعة<input id="f-src" value="${esc(s.source||'')}" placeholder="المورد / المصنع"></label></div>
  <div class="grid2"><label class="f">سعر الجملة (التكلفة)<input id="f-buy" type="number" inputmode="decimal" value="${esc(s.buy)}"></label><label class="f">سعر البيع *<input id="f-sell" type="number" inputmode="decimal" value="${esc(s.sell)}"></label></div>
  <div class="grid2"><label class="f">تخفيض<select id="f-dt"><option value="none" ${s.dType==='none'?'selected':''}>لا يوجد</option><option value="pct" ${s.dType==='pct'?'selected':''}>نسبة %</option><option value="amt" ${s.dType==='amt'?'selected':''}>مبلغ ثابت</option></select></label><label class="f">قيمة التخفيض<input id="f-dv" type="number" inputmode="decimal" value="${esc(s.dVal)}"></label></div>
  <div class="prev" id="prev"></div>
  <div class="b" style="color:var(--m);margin-bottom:6px">المقاسات والكميات</div>
  <div class="chips" style="margin-bottom:8px">${SIZE_CHIPS.map(z=>`<button type="button" class="chip" data-a="addsize" data-v="${z}">+ ${z}</button>`).join('')}<button type="button" class="chip" data-a="addsize" data-v="">+ مقاس آخر</button></div>
  <div id="sizes">${(s.sizes||[]).map(z=>sizeRow(z.size,z.q)).join('')}</div>
  ${it?`<div class="qrbox"><div id="qrhold"></div><div class="b" style="margin:6px 0">${esc(it.code)}</div><div class="row gap wrap" style="justify-content:center"><button class="btn sm" data-a="labels" data-id="${it.id}">🏷 ملصقات QR (PDF)</button><button class="btn sm" data-a="qrpng" data-id="${it.id}">🖼 حفظ صورة QR</button></div></div>`:'<div class="muted" style="margin:8px 0">هيتولد كود QR تلقائيًا بعد الحفظ ويتسجل في شيت الإكسيل.</div>'}
  <div class="grid2" style="margin-top:8px"><button class="btn primary" data-a="saveitem" data-id="${id||''}">💾 حفظ</button>${it?`<button class="btn danger" data-a="delitem" data-id="${id}">حذف</button>`:'<button class="btn" data-a="closesheet">إلغاء</button>'}</div>`);
  if(it){ $('#qrhold',h).appendChild(qrCanvas(it.code,300)); }
  if(!(s.sizes||[]).length) $('#sizes',h).insertAdjacentHTML('beforeend',sizeRow()); itemPrev(); }
function itemPrev(){ const p=$('#prev'); if(!p)return; const t={sell:$('#f-sell').value,buy:$('#f-buy').value,dType:$('#f-dt').value,dVal:$('#f-dv').value};
  const fp=finalPrice(t), pr=fp-num(t.buy), pc=fp>0?pr/fp*100:0;
  p.innerHTML=`<div class="grid3"><div><small>السعر بعد التخفيض</small><b>${money(fp)}</b></div><div><small>الربح للقطعة</small><b class="${pr<0?'bad':'ok'}">${money(pr)}</b></div><div><small>هامش الربح</small><b>${pc.toFixed(1)}%</b></div></div>`; }
function readSizes(){ const out=[]; $$('#sizes .srow').forEach(r=>{ const s=$('.s-size',r).value.trim(), q=num($('.s-qty',r).value); if(s||q>0){ const ex=out.find(o=>o.size===(s||'—')); if(ex)ex.q+=q; else out.push({size:s||'—',q}); } }); return out; }
function saveItem(id){ const name=$('#f-name').value.trim(), sell=num($('#f-sell').value);
  if(!name) return toast('اكتب اسم القطعة'); if(sell<=0) return toast('اكتب سعر البيع');
  let code=$('#f-code').value.trim(); if(code&&db.items.some(i=>i.code.toLowerCase()===code.toLowerCase()&&i.id!==id)) return toast('الكود ده مستخدم لقطعة تانية');
  const rec={name,source:$('#f-src').value.trim(),buy:num($('#f-buy').value),sell,dType:$('#f-dt').value,dVal:num($('#f-dv').value),sizes:readSizes()};
  if(id){ const it=item(id); if(code)it.code=code; Object.assign(it,rec); }
  else { if(!code){ do{ code='RY-'+pad(++db.seq.item,4);}while(db.items.some(i=>i.code===code)); } db.items.push(Object.assign({id:uid(),code,created:today()},rec)); }
  save(); closeSheet(); toast('تم حفظ القطعة ✓'); render(true);
  if(!id) setTimeout(()=>itemSheet(db.items[db.items.length-1].id),350); }

function custSheet(id,fromCart){ const c=id?cust(id):null, s=c||{name:'',code:'',phone:'',address:'',debt:0,dueDate:''};
  sheet(`<h2>${c?'بيانات العميل':'عميل جديد'}</h2>
  <label class="f">اسم العميل *<input id="c-name" value="${esc(s.name)}"></label>
  <div class="grid2"><label class="f">كود العميل<input id="c-code" value="${esc(s.code)}" placeholder="تلقائي"></label><label class="f">رقم الموبايل<input id="c-phone" type="tel" inputmode="tel" value="${esc(s.phone||'')}"></label></div>
  <label class="f">العنوان<input id="c-addr" value="${esc(s.address||'')}"></label>
  <div class="grid2"><label class="f">المديونية الحالية<input id="c-debt" type="number" inputmode="decimal" value="${esc(s.debt||0)}"></label><label class="f">يوم السداد المتفق عليه<input id="c-due" type="date" value="${esc(s.dueDate||'')}"></label></div>
  ${c?'<div class="muted" style="margin:-4px 0 10px">لو غيّرت المديونية بإيدك هتتسجل في كشف الحساب كتعديل يدوي.</div>':''}
  <div class="grid2"><button class="btn primary" data-a="savecust" data-id="${id||''}" data-cart="${fromCart?1:''}">💾 حفظ</button>${c?`<button class="btn danger" data-a="delcust" data-id="${id}">حذف</button>`:'<button class="btn" data-a="closesheet">إلغاء</button>'}</div>`); }
function saveCust(id,fromCart){ const name=$('#c-name').value.trim(); if(!name) return toast('اكتب اسم العميل');
  let code=$('#c-code').value.trim(); if(code&&db.customers.some(c=>c.code.toLowerCase()===code.toLowerCase()&&c.id!==id)) return toast('كود العميل مستخدم');
  const phone=$('#c-phone').value.trim(); const dup=phone&&db.customers.find(c=>c.phone===phone&&c.id!==id); if(dup&&!confirm('الرقم ده مسجل للعميل "'+dup.name+'". تكمل؟')) return;
  const debt=num($('#c-debt').value), rec={name,phone,address:$('#c-addr').value.trim(),dueDate:$('#c-due').value};
  let c; if(id){ c=cust(id); if(code)c.code=code; Object.assign(c,rec); if(Math.abs(debt-num(c.debt))>0.005) addLedger(c,debt-num(c.debt),'adjust','', 'تعديل يدوي من بيانات العميل'); }
  else { if(!code){ do{code='C-'+pad(++db.seq.cust,4);}while(db.customers.some(x=>x.code===code)); } c=Object.assign({id:uid(),code,debt:0,created:today()},rec); db.customers.push(c); if(debt>0) addLedger(c,debt,'adjust','','رصيد افتتاحي'); }
  save(); closeSheet(); toast('تم حفظ العميل ✓');
  if(fromCart){ cart.cust=c.id; const b=$('#custbox'); if(b)b.innerHTML=custBox(); } else render(true); }
function paySheet(id){ const c=cust(id); sheet(`<h2>تسديد مديونية — ${esc(c.name)}</h2>
  <div class="prev"><small>المديونية الحالية</small> <b style="font-size:20px;color:var(--bad)">${cur(c.debt)}</b></div>
  <label class="f">المبلغ المسدد<input id="p-amt" type="number" inputmode="decimal" value="${esc(c.debt)}"></label>
  <div class="grid2"><label class="f">تاريخ التسديد<input id="p-date" type="date" value="${today()}"></label><label class="f">موعد السداد القادم<input id="p-due" type="date" value="${esc(c.dueDate||'')}"></label></div>
  <label class="f">ملاحظة<input id="p-note" placeholder="اختياري"></label>
  <button class="btn primary big" data-a="savepay" data-id="${id}">✅ تسجيل التسديد</button>`); }
function savePay(id){ const c=cust(id), amt=num($('#p-amt').value); if(amt<=0) return toast('اكتب مبلغ صحيح'); if(amt>num(c.debt)+0.005) return toast('المبلغ أكبر من المديونية');
  const date=$('#p-date').value||today(); const e=addLedger(c,-amt,'payment','',$('#p-note').value.trim()); e.date=date;
  db.payments.push({id:uid(),custId:c.id,date,time:hhmm(),amount:amt,balance:c.debt,note:$('#p-note').value.trim()});
  if(c.debt>0.005){ const nd=$('#p-due').value; if(nd)c.dueDate=nd; } else c.dueDate='';
  save(); closeSheet(); toast('تم تسجيل التسديد ✓'); render(true); }

function viewInv(id){ const i=db.invoices.find(x=>x.id===id), c=i.custId&&cust(i.custId);
  sheet(`<h2>فاتورة ${esc(i.no)}</h2><div class="muted" style="margin-bottom:8px">${dAr(i.date)} • ${i.time} • ${c?esc(c.name)+' ('+esc(c.code)+')':'بيع كاش (بدون عميل)'}</div>
  <div class="card scroll-x"><table class="t"><tr><th>القطعة</th><th>مقاس</th><th>كمية</th><th>سعر</th><th>إجمالي</th></tr>${i.lines.map(l=>`<tr><td>${esc(l.name)}<div class="muted">${esc(l.code)}</div></td><td>${esc(l.size||'—')}</td><td>${l.qty}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td></tr>`).join('')}</table></div>
  ${i.extra>0?`<div class="totrow"><span>خصم إضافي</span><b>- ${money(i.extra)}</b></div>`:''}<div class="totrow big"><span>الإجمالي</span><span>${cur(i.total)}</span></div>
  <div class="totrow"><span>المدفوع</span><b class="ok">${cur(i.paid)}</b></div><div class="totrow"><span>الآجل (مديونية)</span><b class="${i.debt>0?'bad':''}">${cur(i.debt)}</b></div>
  ${i.debt>0?`<div class="totrow"><span>موعد السداد</span><b>${dAr(i.due)}</b></div>`:''}<div class="totrow"><span>ربح الفاتورة</span><b>${cur(i.profit)}</b></div>
  <button class="btn primary big" style="margin-top:12px" data-a="invpdf" data-id="${i.id}">📄 فاتورة PDF</button>`); }

function addToCart(it,size){ const sz=(it.sizes||[]).find(s=>s.size===(size||'—')||s.size===size)||null;
  const have=sz?num(sz.q):stockOf(it); const inCart=cart.lines.filter(l=>l.itemId===it.id&&(l.size||'')===(size||'')).reduce((a,l)=>a+l.qty,0);
  if(inCart+1>have){ toast(`المتاح من ${it.name}${size?' مقاس '+size:''} هو ${have} فقط`); return false; }
  const ex=cart.lines.find(l=>l.itemId===it.id&&(l.size||'')===(size||'')); if(ex)ex.qty++; else cart.lines.push({itemId:it.id,code:it.code,name:it.name,size:size||'',qty:1,price:finalPrice(it),buy:num(it.buy)});
  if(ui.tab==='cash'&&!ui.page)refreshCart(); return true; }
function findItem(txt){ const t=txt.trim().toLowerCase(); if(!t)return null; return db.items.find(i=>i.code.toLowerCase()===t); }
function pickSizeFor(it,size){ const avail=(it.sizes||[]).filter(s=>num(s.q)>0);
  if(size) return Promise.resolve(size==='—'?'':size);
  if(avail.length<=1) return Promise.resolve(avail[0]?(avail[0].size==='—'?'':avail[0].size):'');
  return new Promise(res=>{ const s=document.createElement('div'); s.className='sheet-wrap on'; s.style.zIndex=450;
    s.innerHTML=`<div class="sheet-bg" style="opacity:1"></div><div class="sheet" style="transform:none"><div class="grab"></div><h2>${esc(it.name)} — اختر المقاس</h2><div class="chips">${avail.map(z=>`<button class="chip on" style="font-size:16px;padding:9px 20px" data-sz="${esc(z.size)}">${esc(z.size)} <small>(${num(z.q)})</small></button>`).join('')}</div></div>`;
    document.body.appendChild(s); s.onclick=e=>{ const b=e.target.closest('[data-sz]'); if(b){s.remove();res(b.dataset.sz==='—'?'':b.dataset.sz);} }; }); }
async function handleCode(raw){ const [code,sz]=String(raw).trim().split('|'); const it=findItem(code);
  if(!it){ toast('الكود ده مش موجود: '+code); return false; }
  if(stockOf(it)<=0){ toast(it.name+' — خلصت من المخزون'); return false; }
  const size=await pickSizeFor(it,sz); return addToCart(it,size)?it:false; }

function saveInvoice(){ if(!cart.lines.length) return toast('الفاتورة فاضية');
  const total=cartTotal(), paid=cartPaid(), debt=Math.round(Math.max(0,total-paid)*100)/100;
  if(paid>total+0.005) return toast('المدفوع أكبر من الإجمالي');
  if(debt>0.005&&!cart.cust) return toast('اختار أو أضف عميل علشان تسجل الفاتورة آجل');
  const due=debt>0.005?(cart.due||addDays(today(),30)):''; if(debt>0.005&&!due) return toast('حدد يوم السداد');
  for(const l of cart.lines){ const it=item(l.itemId); const sz=it&&it.sizes.find(s=>s.size===(l.size||'—')||s.size===l.size); if(!it||(sz&&num(sz.q)<l.qty)) return toast('مخزون '+l.name+' اتغير — راجع الفاتورة'); }
  const sub=cartSub(), extra=Math.min(num(cart.extra),sub), cost=cart.lines.reduce((a,l)=>a+l.qty*l.buy,0);
  const inv={id:uid(),no:'INV-'+pad(++db.seq.inv,6),date:today(),time:hhmm(),custId:cart.cust,lines:cart.lines.map(l=>({...l})),sub,extra,total,paid,debt,due,profit:Math.round((total-cost)*100)/100,note:cart.note};
  inv.lines.forEach(l=>{ const it=item(l.itemId), sz=it.sizes.find(s=>s.size===(l.size||'—')||s.size===l.size); if(sz)sz.q=num(sz.q)-l.qty; });
  db.invoices.push(inv);
  if(inv.custId){ const c=cust(inv.custId); if(debt>0.005){ addLedger(c,debt,'debt',inv.no,'فاتورة آجلة'); c.dueDate=due; } }

let scanStream=null,scanTimer=null,scanBusy=false,lastCode='',lastAt=0,scanCount=0;
async function startScan(){
  const ov=$('#scan');
  if(!('BarcodeDetector' in window)){ toast('مسح QR بالكاميرا يحتاج Chrome على أندرويد — تقدر تكتب الكود يدويًا أو بجهاز سكانر'); return $('#codeIn')&&$('#codeIn').focus(); }
  try{ scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}); }
  catch(e){ return toast('لازم تسمح للتطبيق باستخدام الكاميرا'); }
  const det=new BarcodeDetector({formats:['qr_code']}), v=$('#scan video'); v.srcObject=scanStream; await v.play().catch(()=>{});
  scanCount=0; lastCode=''; ov.classList.add('on'); scanRefresh();
  scanTimer=setInterval(async()=>{ if(scanBusy||v.readyState<2)return; scanBusy=true;
    try{ const r=await det.detect(v); if(r.length){ const val=r[0].rawValue, now=Date.now(); if(val!==lastCode||now-lastAt>2500){ lastCode=val; lastAt=now; const ok=await handleCode(val); lastAt=Date.now();
        if(ok){ scanCount++; beep(); navigator.vibrate&&navigator.vibrate(60); ov.classList.add('flash'); setTimeout(()=>ov.classList.remove('flash'),400); scanRefresh(); } } } }catch(e){}
    scanBusy=false; },280); }
function scanRefresh(){ $('#scan-n').textContent=scanCount; const p=$('#scan-list'); p.innerHTML=cart.lines.length?cart.lines.map(l=>`<div class="totrow"><span>${esc(l.name)}${l.size?' ('+esc(l.size)+')':''} × ${l.qty}</span><b>${money(l.qty*l.price)}</b></div>`).join('')+`<div class="totrow big"><span>الإجمالي</span><span>${cur(cartTotal())}</span></div>`:'<div class="muted" style="text-align:center">وجّه الكاميرا ناحية QR على القطعة</div>'; }
function stopScan(){ clearInterval(scanTimer); if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;} $('#scan').classList.remove('on'); render(true); }
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(), o=a.createOscillator(), g=a.createGain(); o.frequency.value=1100; g.gain.value=.08; o.connect(g); g.connect(a.destination); o.start(); setTimeout(()=>{o.stop();a.close();},110);}catch(e){} }

 newitem:()=>itemSheet(), edititem:e=>itemSheet(e.dataset.id), addsize:e=>{ const box=$('#sizes'); const v=e.dataset.v; if(v&&$$('.s-size',box).some(i=>i.value.trim()===v)) return;
   const empty=$$('.srow',box).find(r=>!$('.s-size',r).value.trim()&&!$('.s-qty',r).value); if(empty&&v){ $('.s-size',empty).value=v; $('.s-qty',empty).focus(); } else { box.insertAdjacentHTML('beforeend',sizeRow(v,'')); $$('.srow',box).pop().querySelector(v?'.s-qty':'.s-size').focus(); } },
 rmsize:e=>{ const r=e.closest('.srow'); if($$('#sizes .srow').length>1)r.remove(); else {$('.s-size',r).value='';$('.s-qty',r).value='';} },
 saveitem:e=>saveItem(e.dataset.id||null),
 delitem:async e=>{ if(await ask('حذف القطعة نهائيًا؟','حذف',true)){ db.items=db.items.filter(i=>i.id!==e.dataset.id); save(); closeSheet(); render(true); toast('تم الحذف'); } },
 qrpng:e=>{ const it=item(e.dataset.id), c=qrCanvas(it.code,600), o=document.createElement('canvas'); o.width=700;o.height=790; const x=o.getContext('2d'); x.fillStyle='#fff';x.fillRect(0,0,700,790); x.drawImage(c,50,30,600,600); x.fillStyle='#2A1A20'; x.direction='rtl'; x.textAlign='center'; x.font='700 40px Cairo,sans-serif'; x.fillText(it.name,350,680); x.font='500 32px Cairo,sans-serif'; x.fillStyle='#8A193B'; x.fillText(`${it.code}  •  ${money(finalPrice(it))} ${CUR}`,350,740);
   o.toBlob(b=>saveBlob(b,`QR-${it.code}.png`)); },
 labels:e=>{ toast('بجهّز الملصقات…'); labelsPdf(e.dataset.id); },
 exportinv:async()=>{ toast('بجهّز شيت المخزون…'); saveBlob(buildXlsx(invSheets()),`ROYA-المخزون-${stamp()}.xlsx`); },
 exportcust:()=>{ toast('بجهّز شيت العملاء…'); saveBlob(buildXlsx(custSheets()),`ROYA-العملاء-${stamp()}.xlsx`); },
 newcust:e=>custSheet(null,!!e.dataset.cart), editcust:e=>custSheet(e.dataset.id), savecust:e=>saveCust(e.dataset.id||null,!!e.dataset.cart),
 delcust:async e=>{ const c=cust(e.dataset.id); if(await ask(`حذف العميل "${c.name}"؟ (الفواتير القديمة هتفضل محفوظة)`,'حذف',true)){ db.customers=db.customers.filter(x=>x.id!==c.id); save(); closeSheet(); ui.page=null; render(); } },
 opencust:e=>openPage('customer',{id:e.dataset.id,sub:'inv',from:'',to:''}), csub:e=>{ui.page.sub=e.dataset.v;render(true);},
 pay:e=>paySheet(e.dataset.id), savepay:e=>savePay(e.dataset.id), viewinv:e=>viewInv(e.dataset.id),
 invpdf:e=>{ toast('بجهّز الفاتورة…'); invPdf(e.dataset.id); }, custpdf:e=>{ toast('بجهّز الكشف…'); custPdf(e.dataset.id,ui.page&&ui.page.from,ui.page&&ui.page.to); },
 custcash:e=>{ cart.cust=e.dataset.id; go('cash'); },
 scan:startScan, stopscan:stopScan,
 addcode:async()=>{ const i=$('#codeIn'); const v=i.value.trim(); if(!v)return; const ok=await handleCode(v); if(ok){i.value='';$('#isugg').innerHTML='';} },
 pickitem:async e=>{ const it=item(e.dataset.id); const size=await pickSizeFor(it); if(addToCart(it,size)){ $('#codeIn').value=''; $('#isugg').innerHTML=''; } },
 pickcust:e=>{ cart.cust=e.dataset.id; $('#custbox').innerHTML=custBox(); }, clearcust:()=>{cart.cust=null;$('#custbox').innerHTML=custBox();},
 qtyu:e=>{ const l=cart.lines[+e.dataset.i], it=item(l.itemId); const sz=it.sizes.find(s=>s.size===(l.size||'—')||s.size===l.size); if(sz&&l.qty+1>num(sz.q)) return toast('مفيش أكتر من كده في المخزون'); l.qty++; refreshCart(); },
 qtyd:e=>{ const l=cart.lines[+e.dataset.i]; l.qty--; if(l.qty<=0)cart.lines.splice(+e.dataset.i,1); refreshCart(); },
 rmline:e=>{ cart.lines.splice(+e.dataset.i,1); refreshCart(); },
 fullpaid:()=>{cart.paid='';refreshCart();}, fulldebt:()=>{cart.paid='0';refreshCart();},
 resetcart:async()=>{ if(!cart.lines.length&&!cart.cust)return; if(await ask('مسح الفاتورة الحالية؟','مسح',true)){ Object.assign(cart,{cust:null,lines:[],extra:'',paid:'',due:'',note:''}); render(); } },
 saveinv:saveInvoice,
 reptype:e=>{ui.rep.type=e.dataset.v;render(true);},
 reppdf:()=>{ const R=repRange(); toast('بجهّز التقرير…'); reportPdf(R.from,R.to,R.title,R.sub,`ROYA-${R.title.replace(/\s/g,'-')}-${R.from}${R.to!==R.from?'_'+R.to:''}.pdf`); },
 todaypdf:()=>{ const d=today(); toast('بجهّز التقرير…'); reportPdf(d,d,'التقرير اليومي','يوم '+dAr(d),`ROYA-تقرير-يومي-${d}.pdf`); },
 duepdf:()=>{ toast('بجهّز الكشف…'); duePdf(); },
 savestore:()=>{ db.settings.store=$('#s-store').value.trim()||'متجر رويا للملابس'; save(); toast('تم الحفظ'); render(true); },
 notify:async()=>{ if(!('Notification' in window)) return toast('المتصفح ده مش بيدعم الإشعارات'); let p=Notification.permission; if(p!=='granted')p=await Notification.requestPermission();
   if(p==='granted'){ db.settings.notify=true; save(); toast('تم تفعيل الإشعارات'); checkDue(true); } else toast('الإشعارات مرفوضة من إعدادات المتصفح'); },
 backup:()=>saveBlob(new Blob([JSON.stringify(db)],{type:'application/json'}),`ROYA-backup-${stamp()}.json`),
 restore:()=>{ const f=$('#restoref'); f.onchange=async()=>{ try{ const d=JSON.parse(await f.files[0].text()); if(!d.items||!d.customers) throw 0; if(await ask('هيتم استبدال كل البيانات الحالية بالنسخة دي. تكمل؟','استرجاع',true)){ db=Object.assign(blankDB(),d); save(); closeSheet(); render(); toast('تم الاسترجاع ✓'); } }catch(e){ toast('الملف مش نسخة صحيحة'); } }; f.click(); },
 wipe:async()=>{ if(await ask('هتتمسح كل القطع والعملاء والفواتير نهائيًا! متأكد؟','مسح كل شيء',true)){ db=blankDB(); save(); closeSheet(); render(); toast('تم المسح'); } }
};
document.addEventListener('click',e=>{ const t=e.target.closest('[data-a]'); if(!t)return; const f=A[t.dataset.a]; if(f){ e.preventDefault(); f(t); } });
document.addEventListener('input',e=>{ const t=e.target;
  if(t.closest('#sheet')&&['f-sell','f-buy','f-dt','f-dv'].includes(t.id)) return itemPrev();
  const k=t.dataset.i; if(!k)return;
  if(k==='qinv'){ui.q.inv=t.value;$('#list').innerHTML=invList();}
  else if(k==='qcust'){ui.q.cust=t.value;$('#list').innerHTML=custList();}
  else if(k==='custq'){ const q=t.value.trim().toLowerCase(); $('#custsugg').innerHTML=q?db.customers.filter(c=>(c.name+c.code+(c.phone||'')).toLowerCase().includes(q)).slice(0,6).map(c=>`<div class="li" data-a="pickcust" data-id="${c.id}"><div class="av">${esc(initial(c.name))}</div><div class="grow"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.code)} • ${esc(c.phone||'')}</div></div><div class="price ${num(c.debt)>0?'bad':''}">${num(c.debt)>0?money(c.debt):''}</div></div>`).join('')||'<div class="muted">مفيش عميل بالاسم ده — دوس "عميل جديد"</div>':''; }
  else if(k==='codein'){ const q=t.value.trim().toLowerCase(); $('#isugg').innerHTML=q?db.items.filter(i=>(i.name+' '+i.code).toLowerCase().includes(q)&&stockOf(i)>0).slice(0,5).map(i=>`<div class="li" data-a="pickitem" data-id="${i.id}"><div class="av">${esc(initial(i.name))}</div><div class="grow"><div class="t">${esc(i.name)}</div><div class="s">${esc(i.code)} • متاح ${stockOf(i)}</div></div><div class="price">${money(finalPrice(i))}</div></div>`).join(''):''; }
  else if(k==='cx'){cart.extra=t.value;refreshRem();} else if(k==='cp'){cart.paid=t.value;refreshRem();} else if(k==='cd')cart.due=t.value; else if(k==='cn')cart.note=t.value;
  else if(k==='rdate'){ui.rep.date=t.value||today();updRep();} else if(k==='rmonth'){ui.rep.month=t.value||today().slice(0,7);updRep();} else if(k==='ryear'){ui.rep.year=t.value||ui.rep.year;updRep();} else if(k==='rfrom'){ui.rep.from=t.value;updRep();} else if(k==='rto'){ui.rep.to=t.value;updRep();}
  else if(k==='cfrom'){ui.page.from=t.value;render(true);} else if(k==='cto'){ui.page.to=t.value;render(true);} });
function updRep(){ const o=$('#repout'); if(o){o.innerHTML=repPreview();$('#repsub').textContent=repRange().sub;} }
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='codeIn'){ e.preventDefault(); A.addcode(); } });

/* ===================== التشغيل ===================== */
function boot(){
  const L=window.LOGO_DATA; document.documentElement.style.setProperty('--logo',`url(${L})`);
  window.LOGO_IMG=new Image(); window.LOGO_IMG.src=L;
  buildNav(); render();
  const sp=$('#splash'); let closed=false; const close=()=>{ if(closed)return; closed=true; sp.classList.add('out'); setTimeout(()=>{sp.remove();checkDue();},700); };
  sp.addEventListener('click',close); setTimeout(close,3600);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!$('#splash')) checkDue(); });
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
document.addEventListener('DOMContentLoaded',boot);
</script>
